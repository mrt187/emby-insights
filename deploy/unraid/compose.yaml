name: emby-insights

services:
  emby-insights:
    build:
      context: ./build
      dockerfile: docker/all-in-one/Dockerfile
    image: emby-insights:local
    container_name: emby-insights
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${EMBY_INSIGHTS_PORT:-8081}:8080"
    volumes:
      - ./config:/config
