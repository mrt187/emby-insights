name: emby-insights

services:
  emby-insights:
    image: ${EMBY_INSIGHTS_IMAGE:-ghcr.io/mrt187/emby-insights:latest}
    pull_policy: always
    container_name: emby-insights
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${EMBY_INSIGHTS_PORT:-8081}:8080"
    volumes:
      - ./config:/config
