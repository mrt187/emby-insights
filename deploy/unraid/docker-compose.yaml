name: emby-insights

services:
  emby-insights:
    image: registry.example.com/homelab/emby-insights:latest
    pull_policy: always
    container_name: emby-insights
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${EMBY_INSIGHTS_PORT:-8081}:8080"
    volumes:
      - ./config:/config
    networks:
      - dockernet

networks:
  dockernet:
    external: true
