name: emby-insights

services:
  emby-insights:
    # No default: the image lives in a private registry, so EMBY_INSIGHTS_IMAGE
    # has to name it explicitly in .env (see .env.example).
    image: ${EMBY_INSIGHTS_IMAGE:?set EMBY_INSIGHTS_IMAGE in .env}
    pull_policy: always
    container_name: emby-insights
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${EMBY_INSIGHTS_PORT:-8081}:8080"
    volumes:
      - ./config:/config
