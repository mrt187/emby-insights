name: Build and Push Image

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: echo "version=$(cat VERSION)" >> "$GITEA_OUTPUT"

      # The frontend build stage only receives frontend/, so it cannot read
      # VERSION and carries its own APP_VERSION constant. That constant is
      # what the UI shows, so a forgotten bump ships a release labelled with
      # the previous version — this fails the build instead.
      - name: Version label matches VERSION
        run: |
          version=$(cat VERSION)
          grep -q "APP_VERSION = \"$version\"" frontend/app/page.tsx || {
            echo "VERSION is $version, but frontend/app/page.tsx says:"
            grep -n "APP_VERSION = " frontend/app/page.tsx
            exit 1
          }

      # REGISTRY_HOST is a repository variable so the registry this pushes to
      # is not baked into a public repo. Set it under Settings -> Actions ->
      # Variables; REGISTRY_TOKEN stays a secret.
      - name: Log in to the container registry
        run: echo "${{ secrets.REGISTRY_TOKEN }}" | docker login "${{ vars.REGISTRY_HOST }}" -u "${{ github.actor }}" --password-stdin

      - name: Build and push image
        run: |
          docker buildx build --platform linux/amd64 \
            --tag ${{ vars.REGISTRY_HOST }}/homelab/emby-insights:${{ steps.version.outputs.version }} \
            --tag ${{ vars.REGISTRY_HOST }}/homelab/emby-insights:${{ github.sha }} \
            --tag ${{ vars.REGISTRY_HOST }}/homelab/emby-insights:latest \
            -f docker/all-in-one/Dockerfile \
            --push .
