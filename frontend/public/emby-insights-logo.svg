<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3a4d3e"></stop>
      <stop offset="100%" stop-color="#141f18"></stop>
    </linearGradient>
    <linearGradient id="glyph" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"></stop>
      <stop offset="100%" stop-color="#a9dfb0"></stop>
    </linearGradient>
    <radialGradient id="innerGlow" cx="30%" cy="18%" r="90%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.16"></stop>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"></stop>
    </radialGradient>
    <filter id="borderGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="9" result="blur"></feGaussianBlur>
      <feMerge>
        <feMergeNode in="blur"></feMergeNode>
        <feMergeNode in="SourceGraphic"></feMergeNode>
      </feMerge>
    </filter>
  </defs>
  <rect x="26" y="26" width="460" height="460" rx="118" fill="url(#glass)"></rect>
  <rect x="26" y="26" width="460" height="460" rx="118" fill="url(#innerGlow)"></rect>
  <rect x="26" y="26" width="460" height="460" rx="118" fill="none" stroke="#7fae86" stroke-width="3" stroke-opacity="0.7" filter="url(#borderGlow)"></rect>
  <g>
    <circle cx="256" cy="256" r="117" fill="none" stroke="url(#glyph)" stroke-width="18" stroke-dasharray="48 29" stroke-linecap="round"></circle>
    <polygon points="225,216 225,296 302,256" fill="url(#glyph)"></polygon>
  </g>
</svg>
